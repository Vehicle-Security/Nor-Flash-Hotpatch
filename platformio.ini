; =============================================================================
; ClearBitPatch — NOR-Flash Hotpatching for ARM Cortex-M4 (nRF52840)
; =============================================================================
;
; Build targets:
;   pio run -e baremetal            Baremetal baseline
;   pio run -e freertos             FreeRTOS
;   pio run -e liteos               LiteOS
;   pio run -e nuttx                NuttX
;   pio run -e compare              Compare (RapidPatch / HERA / AutoPatch)
;   pio run -e realworld            Real-world LED demo (baremetal)
;   pio run -e realworld_freertos   Real-world LED demo (FreeRTOS)
;
; RISC-V target lives in riscv/platformio.ini (separate platform).
; =============================================================================

[platformio]
src_dir = .
core_dir = .pio

; ---------------------------------------------------------------------------
; Common settings shared by every ARM environment
; ---------------------------------------------------------------------------
[env]
platform = nordicnrf52
board = nrf52840_dk
upload_protocol = jlink
debug_tool = jlink
debug_speed = 4000
board_build.ldscript = platform/nrf52840/linker/uart_gcc_nrf52.ld
extra_scripts = pre:platformio_extra.py

build_flags =
  -DBOARD_PCA10056
  -DBSP_DEFINES_ONLY
  -DCONFIG_GPIO_AS_PINRESET
  -DNRF52840_XXAA
  -D__HEAP_SIZE=8192
  -D__STACK_SIZE=8192
  -fshort-enums
  -fno-builtin
  -fno-strict-aliasing
  -mfloat-abi=hard
  -mfpu=fpv4-sp-d16
  ; --- project-wide include roots ---
  -I.
  -Iplatform/nrf52840/config
  ; --- nRF5 SDK headers ---
  -Ivendor/nRF5_SDK_17.1.0/components
  -Ivendor/nRF5_SDK_17.1.0/components/boards
  -Ivendor/nRF5_SDK_17.1.0/components/drivers_nrf/nrf_soc_nosd
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/atomic
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/bsp
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/experimental_section_vars
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/fifo
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/log
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/log/src
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/uart
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/util
  -Ivendor/nRF5_SDK_17.1.0/components/libraries/strerror
  -Ivendor/nRF5_SDK_17.1.0/components/toolchain/cmsis/include
  -Ivendor/nRF5_SDK_17.1.0/external/segger_rtt
  -Ivendor/nRF5_SDK_17.1.0/integration/nrfx
  -Ivendor/nRF5_SDK_17.1.0/integration/nrfx/legacy
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/include
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/src
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/src/prs
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/hal
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/mdk
  -Ivendor/nRF5_SDK_17.1.0/modules/nrfx/soc

; ---------------------------------------------------------------------------
; ClearBitPatch — baremetal baseline
; ---------------------------------------------------------------------------
[env:baremetal]
build_src_filter =
  +<core/>
  +<ports/baremetal/>
  +<platform/nrf52840/sdk_src/>

; ---------------------------------------------------------------------------
; ClearBitPatch — FreeRTOS
; ---------------------------------------------------------------------------
[env:freertos]
build_src_filter =
  +<core/>
  +<ports/freertos/>
  +<platform/nrf52840/sdk_src/>
  +<vendor/FreeRTOS-Kernel/tasks.c>
  +<vendor/FreeRTOS-Kernel/queue.c>
  +<vendor/FreeRTOS-Kernel/list.c>
  +<vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
  +<vendor/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
build_flags =
  ${env.build_flags}
  -DCLEARBIT_PORT_FREERTOS=1
  -Iplatform/nrf52840/config/freertos
  -Ivendor/FreeRTOS-Kernel/include
  -Ivendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F

; ---------------------------------------------------------------------------
; ClearBitPatch — LiteOS
; ---------------------------------------------------------------------------
[env:liteos]
build_src_filter =
  +<core/>
  +<ports/liteos/>
  +<platform/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -DCLEARBIT_PORT_LITEOS=1
  -Ivendor/LiteOS/kernel/include
  -Ivendor/LiteOS/arch/arm/cortex_m/include
  -Ivendor/LiteOS/arch/arm/cortex_m/cmsis

; ---------------------------------------------------------------------------
; ClearBitPatch — NuttX
; ---------------------------------------------------------------------------
[env:nuttx]
build_src_filter =
  +<core/>
  +<ports/nuttx/>
  +<platform/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -DCLEARBIT_PORT_NUTTX=1

; ---------------------------------------------------------------------------
; Compare — benchmark ClearBitPatch vs RapidPatch / HERA / AutoPatch
; Uses its own console, benchmark, and patch dispatch (multi-scheme support).
; ---------------------------------------------------------------------------
[env:compare]
board_build.ldscript = platform/nrf52840/linker/uart_gcc_nrf52_compare.ld
build_src_filter =
  +<core/app/>
  +<core/patch/clearbit_patch.c>
  +<core/patch/patch_result.c>
  +<core/platform/>
  +<compare/>
  +<platform/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -Icompare/src
  -Icompare
  -Icompare/target

; ---------------------------------------------------------------------------
; Real-world LED demo — baremetal
; Uses led_demo instead of CVE targets for vuln_fun / patch_fun.
; ---------------------------------------------------------------------------
[env:realworld]
build_src_filter =
  +<core/>
  -<core/target/vuln_fun.c>
  -<core/target/patch_fun.c>
  +<realworld/src/>
  +<realworld/target/>
  +<ports/baremetal/>
  +<platform/nrf52840/sdk_src/>

; ---------------------------------------------------------------------------
; Real-world LED demo — FreeRTOS
; ---------------------------------------------------------------------------
[env:realworld_freertos]
build_src_filter =
  +<core/patch/clearbit_patch.c>
  +<core/patch/patch_dispatch.c>
  +<core/patch/patch_result.c>
  +<realworld/src/>
  +<realworld/target/>
  +<realworld/ports/freertos/>
  +<platform/nrf52840/sdk_src/>
  +<vendor/FreeRTOS-Kernel/tasks.c>
  +<vendor/FreeRTOS-Kernel/queue.c>
  +<vendor/FreeRTOS-Kernel/list.c>
  +<vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
  +<vendor/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
  +<vendor/FreeRTOS-Kernel/tasks.c>
  +<vendor/FreeRTOS-Kernel/queue.c>
  +<vendor/FreeRTOS-Kernel/list.c>
  +<vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
  +<vendor/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
build_flags =
  ${env.build_flags}
  -DCLEARBIT_PORT_FREERTOS=1
  -Iplatform/nrf52840/config/freertos
  -Ivendor/FreeRTOS-Kernel/include
  -Ivendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F
