; =============================================================================
; MorphPatch — NOR-Flash Hotpatching for ARM Cortex-M4 (nRF52840)
; =============================================================================
;
; Build targets:
;   pio run -e baremetal            Baremetal baseline
;   pio run -e freertos             FreeRTOS
;   pio run -e liteos               LiteOS
;   pio run -e nuttx                NuttX
;   pio run -e compare              Compare (RapidPatch / HERA / AutoPatch)
;   pio run -e realworld            Real-world LED demo (baremetal)
;   pio run -e realworld_freertos   Real-world LED demo (FreeRTOS)
;
; RISC-V target lives in targets/ch32v203/platformio.ini (separate platform).
; =============================================================================

[platformio]
src_dir = .
core_dir = .pio

; ---------------------------------------------------------------------------
; Common settings shared by every ARM environment
; ---------------------------------------------------------------------------
[env]
platform = nordicnrf52
board = nrf52840_dk
upload_protocol = jlink
debug_tool = jlink
debug_speed = 4000
board_build.ldscript = targets/nrf52840/linker/uart_gcc_nrf52.ld
extra_scripts = pre:platformio_extra.py

build_flags =
  -DBOARD_PCA10056
  -DBSP_DEFINES_ONLY
  -DCONFIG_GPIO_AS_PINRESET
  -DNRF52840_XXAA
  -D__HEAP_SIZE=8192
  -D__STACK_SIZE=8192
  -fshort-enums
  -fno-builtin
  -fno-strict-aliasing
  -mfloat-abi=hard
  -mfpu=fpv4-sp-d16
  ; --- project-wide include roots ---
  -I.
  -Isrc
  -Itargets/nrf52840/config
  ; --- nRF5 SDK headers ---
  -Itargets/vendor/nRF5_SDK_17.1.0/components
  -Itargets/vendor/nRF5_SDK_17.1.0/components/boards
  -Itargets/vendor/nRF5_SDK_17.1.0/components/drivers_nrf/nrf_soc_nosd
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/atomic
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/bsp
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/experimental_section_vars
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/fifo
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/log
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/log/src
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/uart
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/util
  -Itargets/vendor/nRF5_SDK_17.1.0/components/libraries/strerror
  -Itargets/vendor/nRF5_SDK_17.1.0/components/toolchain/cmsis/include
  -Itargets/vendor/nRF5_SDK_17.1.0/external/segger_rtt
  -Itargets/vendor/nRF5_SDK_17.1.0/integration/nrfx
  -Itargets/vendor/nRF5_SDK_17.1.0/integration/nrfx/legacy
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/include
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/src
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/drivers/src/prs
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/hal
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/mdk
  -Itargets/vendor/nRF5_SDK_17.1.0/modules/nrfx/soc

; ---------------------------------------------------------------------------
; MorphPatch — baremetal baseline
; ---------------------------------------------------------------------------
[env:baremetal]
build_src_filter =
  +<src/core/>
  +<ports/baremetal/>
  +<targets/nrf52840/sdk_src/>

; ---------------------------------------------------------------------------
; MorphPatch — FreeRTOS
; ---------------------------------------------------------------------------
[env:freertos]
build_src_filter =
  +<src/core/>
  +<ports/freertos/>
  +<targets/nrf52840/sdk_src/>
  +<targets/vendor/FreeRTOS-Kernel/tasks.c>
  +<targets/vendor/FreeRTOS-Kernel/queue.c>
  +<targets/vendor/FreeRTOS-Kernel/list.c>
  +<targets/vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
  +<targets/vendor/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
build_flags =
  ${env.build_flags}
  -DMORPH_PORT_FREERTOS=1
  -Itargets/nrf52840/config/freertos
  -Itargets/vendor/FreeRTOS-Kernel/include
  -Itargets/vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F

; ---------------------------------------------------------------------------
; MorphPatch — LiteOS
; ---------------------------------------------------------------------------
[env:liteos]
build_src_filter =
  +<src/core/>
  +<ports/liteos/>
  +<targets/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -DMORPH_PORT_LITEOS=1
  -Itargets/vendor/LiteOS/kernel/include
  -Itargets/vendor/LiteOS/arch/arm/cortex_m/include
  -Itargets/vendor/LiteOS/arch/arm/cortex_m/cmsis

; ---------------------------------------------------------------------------
; MorphPatch — NuttX
; ---------------------------------------------------------------------------
[env:nuttx]
build_src_filter =
  +<src/core/>
  +<ports/nuttx/>
  +<targets/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -DMORPH_PORT_NUTTX=1

; ---------------------------------------------------------------------------
; Compare — benchmark MorphPatch vs RapidPatch / HERA / AutoPatch
; Uses its own console, benchmark, and patch dispatch (multi-scheme support).
; ---------------------------------------------------------------------------
[env:compare]
board_build.ldscript = targets/nrf52840/linker/uart_gcc_nrf52_compare.ld
build_src_filter =
  +<src/core/app/>
  +<src/core/patch/morph_patch.c>
  +<src/core/patch/patch_result.c>
  +<src/core/patch/hardfault_handler.c>
  +<src/core/platform/>
  +<src/compare/>
  +<targets/nrf52840/sdk_src/>
build_flags =
  ${env.build_flags}
  -Isrc/compare/src
  -Isrc/compare
  -Isrc/compare/target

; ---------------------------------------------------------------------------
; Real-world LED demo — baremetal
; Uses led_demo instead of CVE targets for vuln_fun / patch_fun.
; ---------------------------------------------------------------------------
[env:realworld]
build_src_filter =
  +<src/core/>
  -<src/core/target/vuln_fun.c>
  -<src/core/target/patch_fun.c>
  +<src/realworld/src/>
  +<src/realworld/target/>
  +<ports/baremetal/>
  +<targets/nrf52840/sdk_src/>

; ---------------------------------------------------------------------------
; Real-world LED demo — FreeRTOS
; ---------------------------------------------------------------------------
[env:realworld_freertos]
build_src_filter =
  +<src/core/patch/morph_patch.c>
  +<src/core/patch/patch_dispatch.c>
  +<src/core/patch/patch_result.c>
  +<src/core/patch/hardfault_handler.c>
  +<src/realworld/src/>
  +<src/realworld/target/>
  +<src/realworld/ports/freertos/>
  +<targets/nrf52840/sdk_src/>
  +<targets/vendor/FreeRTOS-Kernel/tasks.c>
  +<targets/vendor/FreeRTOS-Kernel/queue.c>
  +<targets/vendor/FreeRTOS-Kernel/list.c>
  +<targets/vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
  +<targets/vendor/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
build_flags =
  ${env.build_flags}
  -DMORPH_PORT_FREERTOS=1
  -Itargets/nrf52840/config/freertos
  -Itargets/vendor/FreeRTOS-Kernel/include
  -Itargets/vendor/FreeRTOS-Kernel/portable/GCC/ARM_CM4F
