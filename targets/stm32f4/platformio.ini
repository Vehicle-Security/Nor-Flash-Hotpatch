; =============================================================================
; MorphPatch — STM32F411CE (Cortex-M4, ST-Link) compare benchmark
; =============================================================================
;
; Build:
;   cd targets/stm32f4
;   pio run -e stm32f4_compare
;
; This target reuses the shared src/core/ and src/compare/ sources but
; provides its own morph_patch_stm32.c with STM32F4 FLASH registers
; instead of nRF52840 NRF_NVMC.
;
; Console output uses SEGGER RTT (hardware-independent on any ARM Cortex-M
; with SWD).
; =============================================================================

[platformio]
src_dir = ../..
core_dir = .pio

[env:stm32f4_compare]
platform = ststm32
board = genericSTM32F411CE
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
debug_speed = 4000
board_build.ldscript = $PROJECT_DIR/linker/stm32f4_compare.ld

build_src_filter =
  +<src/core/app/>
  +<src/core/patch/patch_result.c>
  +<src/core/patch/hardfault_handler.c>
  +<src/core/platform/>
  +<src/compare/>
  -<src/compare/main.c>
  +<targets/stm32f4/src/>

build_flags =
  -I../../targets/stm32f4/src
  -I../../
  -I../../src
  -I../../src/core/patch
  -I../../src/core/target
  -I../../src/compare/src
  -I../../src/compare
  -I../../src/compare/target
  -include stm32f4xx.h
  -fshort-enums
  -fno-builtin
  -fno-strict-aliasing
